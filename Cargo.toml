[package]
name = "opensubsonic"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Complete async Rust client for the OpenSubsonic/Subsonic REST API"
repository = "https://github.com/M0Rf30/opensubsonic-rs"
keywords = ["subsonic", "opensubsonic", "navidrome", "music", "api"]
categories = ["api-bindings", "multimedia::audio", "network-programming"]
rust-version = "1.85"
documentation = "https://docs.rs/opensubsonic"
readme = "README.md"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth hashing
md-5 = "0.11"
rand = "0.10"

# URL handling
url = "2"

# Byte buffers
bytes = "1"

# Async
futures-util = "0.3"

# Logging
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
